<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pagina de prueba</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ffffff;
      color: #111827;
      font-family: Arial, Helvetica, sans-serif;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 600;
      text-align: center;
    }
    .whatsapp {
      position: fixed;
      right: 22px;
      bottom: 22px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-radius: 999px;
      background: #25D366;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.18);
    }
    .whatsapp:hover { background: #1ebe5d; }
    .whatsapp:focus-visible {
      outline: 3px solid #111827;
      outline-offset: 4px;
    }
    .whatsapp svg { width: 24px; height: 24px; flex: none; }
  </style>
</head>

  <main>
    <h1>pagina de prueba</h1>
  </main>
